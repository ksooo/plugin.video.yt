name: Unit tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  unittests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Kodi on Linux uses the system's Python, which may be as old as 3.8;
        # Kodi 22 itself ships 3.14. Both have to stay happy.
        python-version: ['3.8', '3.14']
    name: Python ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
